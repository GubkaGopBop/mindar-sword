<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>MindAR — трекинг изображения</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      html {
        background: #000;
      }

      body {
        position: relative;
        background: transparent;
      }

      a-scene {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: transparent !important;
      }

      body > video {
        z-index: 0 !important;
      }

      .a-enter-vr,
      .a-enter-ar,
      .a-orientation-modal,
      .a-dialog,
      .a-loader-title {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;
                    autoStart: true;
                    uiLoading: no;
                    uiScanning: yes;
                    uiError: yes;
                    filterMinCF: 0.0001;
                    filterBeta: 0.001;"
      color-space="sRGB"
      renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; exposure: 1.15; antialias: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false"
    >
      <a-assets timeout="15000">
        <a-asset-item id="sword-model" src="./assets/model.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
      <a-light
        type="directional"
        color="#ffffff"
        intensity="2.2"
        position="1 2 3"
      ></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="#sword-model"
          position="0 -1.2 0.08"
          rotation="0 0 0"
          scale="2.4 2.4 2.4"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
